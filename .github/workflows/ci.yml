name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "20"
  BUN_VERSION: "1.1"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run format check
        run: bun run format:check

      - name: Run typecheck
        run: bun run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: heliobond_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/heliobond_test
      NODE_ENV: test
      JWT_SECRET: test-secret-key-for-testing-only
      ADMIN_API_KEY: test-admin-key
      REQUEST_SIGNING_SECRET: test-signing-secret
      FRONTEND_URL: http://localhost:3000
      STELLAR_NETWORK: testnet
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

      - name: Run database migrations
        run: npm run migrate:latest || true

      - name: Run tests
        run: npm run test

      - name: Run contract tests
        run: npm run test -- --testPathPattern=openapi-contract

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  openapi-spec:
    name: OpenAPI Spec Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export OpenAPI spec
        run: bun run openapi:export

      - name: Check OpenAPI spec is up to date
        run: bun run openapi:check

      - name: Validate OpenAPI spec structure
        run: bun run test --testPathPattern=openapi-spec

  api-client:
    name: Generate & Test API Client
    runs-on: ubuntu-latest
    needs: [openapi-spec]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate API client
        run: bun run api-client:generate

      - name: Build API client
        run: bun run api-client:build

      - name: Verify client builds successfully
        run: |
          cd packages/api-client
          bun run build
          # Verify types can be imported
          echo "import { createApiClient } from './src';" | bun --eval

      - name: Upload API client as artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-client
          path: packages/api-client/
          retention-days: 7

  publish-api-client:
    name: Publish API Client to GitHub Packages
    runs-on: ubuntu-latest
    needs: [api-client, test, lint-and-typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
          registry-url: "https://npm.pkg.github.com"

      - name: Download API client artifact
        uses: actions/download-artifact@v4
        with:
          name: api-client
          path: packages/api-client

      - name: Install client dependencies
        run: cd packages/api-client && bun install

      - name: Publish to GitHub Packages
        run: cd packages/api-client && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-stale-spec:
    name: Check for Stale OpenAPI Spec (Scheduled)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export OpenAPI spec
        run: bun run openapi:export

      - name: Check for changes
        run: |
          if ! git diff --quiet openapi.json; then
            echo "::error::OpenAPI spec is stale! Commit the updated openapi.json"
            exit 1
          fi
        shell: bash